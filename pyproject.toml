[project]
name = "datasynth"
version = "0.0.1-dev"
description = "Agentic AI CLI that turns a natural-language ask into a trained model over enterprise data"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "polars>=1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.3",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "rich>=13.0",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "pandas>=2.0",
    "pyarrow>=14",
    "scikit-learn>=1.3",
    "numpy>=1.26",
    "reportlab>=4.5.1",
    "plotext>=5.2",
    "prompt-toolkit>=3.0",
    "pyfiglet>=1.0",
]

[tool.datasynth]
# project-local config notes live in datasynth/config.py
